<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a0e12"/>
      <stop offset="100%" stop-color="#050303"/>
    </radialGradient>
    <!-- Metallic gold: dark amber base → bright highlight top-left → warm mid → deep shadow bottom. -->
    <linearGradient id="metal" x1="20%" y1="10%" x2="80%" y2="95%">
      <stop offset="0%"  stop-color="#f8e58a"/>
      <stop offset="18%" stop-color="#ffd75f"/>
      <stop offset="42%" stop-color="#E8B547"/>
      <stop offset="70%" stop-color="#a67518"/>
      <stop offset="100%" stop-color="#5a3d08"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="10" fill="url(#bg)"/>
  <!-- Base V in metallic gradient -->
  <text x="32" y="46"
        font-family="Playfair Display, Didot, Georgia, serif"
        font-weight="700" font-style="italic"
        font-size="42"
        text-anchor="middle"
        fill="url(#metal)"
        style="letter-spacing:-0.02em">V</text>
  <!-- Top sheen for the metallic highlight -->
  <text x="32" y="46"
        font-family="Playfair Display, Didot, Georgia, serif"
        font-weight="700" font-style="italic"
        font-size="42"
        text-anchor="middle"
        fill="url(#sheen)"
        style="letter-spacing:-0.02em">V</text>
</svg>
