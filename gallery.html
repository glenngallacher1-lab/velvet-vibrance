  <!-- ══════════════════════════════════════════════════════════
       MEDIA SOURCE — add one line per item.
       type: 'image' (default) | 'video'
       Optional `poster` for video first-frame thumbnail.
  ══════════════════════════════════════════════════════════ -->
  <script>
    const MEDIA = [
      { src: 'IMG_0446.jpg',                                                     label: 'Velvet · 0446' },
      { src: 'stanzza-03.mp4',  type: 'video', poster: 'stanzza-03-poster.jpg', label: 'STANZZA · Marquee' },
      { src: 'dj-orange.jpg',                                                    label: 'In Session · 02' },
      { src: 'stanzza-still-01.jpg',                                             label: 'STANZZA · Pink' },
      { src: 'IMG_0431.jpg',                                                     label: 'Velvet · 0431' },
      { src: 'vv-event.mp4',    type: 'video',                                   label: 'Live · Reel' },
      { src: 'IMG_9627.jpg',                                                     label: 'Outdoor · Lights' },
      { src: 'stanzza-01.mp4',  type: 'video', poster: 'stanzza-01-poster.jpg', label: 'STANZZA · Room' },
      { src: 'IMG_0447.jpg',                                                     label: 'Velvet · 0447' },
      { src: 'IMG_0253.jpg',                                                     label: 'Crowd · Heater' },
      { src: 'Image-2-15-26-939AM.jpg',                                          label: 'Decks · 02·15' },
      { src: 'stanzza-02.mp4',  type: 'video', poster: 'stanzza-02-poster.jpg', label: 'STANZZA · Decks' },
      { src: 'crowd-outdoor.jpeg',                                               label: 'Outdoor · Sun' },
      { src: 'IMG_0369.jpg',                                                     label: 'Crowd · Pink' },
      { src: 'stanzza-04.mp4',  type: 'video', poster: 'stanzza-04-poster.jpg', label: 'STANZZA · Daylight' },
      { src: 'IMG_0436.jpg',                                                     label: 'Velvet · 0436' },
      { src: 'DSC08604.jpg',                                                    label: 'Heart · Frequency' },
      { src: 'stanzza-teaser.jpg',                                               label: 'STANZZA · Marquee Wide' },
      { src: 'IMG_0484.jpg',                                                     label: 'Velvet · 0484' },
      { src: 'stanzza-still-03.jpg',                                             label: 'Outdoor · Set' },
      { src: '4A2E3D97-47D6-48A3-86AE-560F807ADFE0.jpeg',                        label: 'Velvet · Latest' }
    ];

    /* Fisher–Yates shuffle so every visit gets a fresh mosaic order.
       Admin still edits the canonical MEDIA[] source; the live page just
       reshuffles that same set on each load. */
    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    (function renderMosaic() {
      const mosaic = document.getElementById('mosaic');
      shuffleArray(MEDIA).forEach(function (m) {
        const isVideo = m.type === 'video';
        const item = document.createElement('div');
        item.className = 'rg-item' + (isVideo ? ' rg-video' : '');

        if (isVideo) {
          const v = document.createElement('video');
          v.src = m.src;
          v.muted = true;
          v.loop = true;
          v.playsInline = true;
          v.preload = 'metadata';
          if (m.poster) v.poster = m.poster;
          item.appendChild(v);
        } else {
          const img = document.createElement('img');
          img.src = m.src;
          img.alt = m.label || '';
          img.loading = 'lazy';
          img.decoding = 'async';
          item.appendChild(img);
        }

        const overlay = document.createElement('div');
        overlay.className = 'rg-overlay';
        const span = document.createElement('span');
        span.textContent = m.label || '';
        overlay.appendChild(span);
        item.appendChild(overlay);

        mosaic.appendChild(item);
      });
    })();
  </script>
