  <script>
    /* Book form submitter — POSTs to the same Apps Script deployment
       as every other form on the site; the `form: 'booking'` field
       tells the backend which sheet + email handler to run. */
    async function submitBookForm(form) {
      const statusEl = document.getElementById('bk-status');
      const data = { form: 'booking' };
      new FormData(form).forEach((val, key) => { data[key] = val; });

      const btn = form.querySelector('.cf-submit');
      const origLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Sending…';
      statusEl.textContent = '';
      statusEl.className = 'cf-status';

      const endpoint = window.VV_ENDPOINT;
      if (!endpoint || /PASTE_YOUR/.test(endpoint)) {
        statusEl.textContent = 'Bookings are being set up — email velvetvibrance@gmail.com in the meantime.';
        statusEl.classList.add('error');
        btn.disabled = false; btn.textContent = origLabel;
        return;
      }

      const url = endpoint + (endpoint.indexOf('?') === -1 ? '?' : '&') +
                  'origin=' + encodeURIComponent(location.origin);
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data),
          redirect: 'follow'
        });
        const txt = await res.text();
        let parsed;
        try { parsed = JSON.parse(txt); }
        catch { throw new Error('Non-JSON response'); }

        if (parsed && parsed.ok) {
          form.reset();
          statusEl.textContent = 'Sent — thanks. I\'ll be in touch within 48 hours.';
          statusEl.classList.add('success');
        } else {
          const err = (parsed && parsed.error) || 'unknown';
          statusEl.textContent = 'Could not send (' + err + '). Try again or email velvetvibrance@gmail.com.';
          statusEl.classList.add('error');
        }
      } catch (err) {
        statusEl.textContent = 'Network error. Try again or email velvetvibrance@gmail.com.';
        statusEl.classList.add('error');
      } finally {
        btn.disabled = false;
        btn.textContent = origLabel;
      }
    }
    document.getElementById('form-book').addEventListener('submit', e => {
      e.preventDefault();
      submitBookForm(e.target);
    });
  </script>
