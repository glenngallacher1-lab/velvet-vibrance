  <!-- Endpoint: same Apps Script deployment as the join form; the
       backend routes on data.form so a single URL serves all forms. -->
  <script>
    window.VV_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxKPcK1bRYUDijZENkCcSkNSflb3yaom7d5abVwcGUrPfFkmVFyEuU9smumyZBSAiuE5w/exec';
  </script>
  <script src="script.js" defer></script>

  <script>
    /* Tab switcher — swap active class + aria-selected + hide/show
       the corresponding form panel. */
    (function initTabs() {
      const tabs = document.querySelectorAll('.contact-tab');
      const forms = document.querySelectorAll('.contact-form');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const targetId = tab.getAttribute('aria-controls');
          tabs.forEach(t => {
            const on = t === tab;
            t.classList.toggle('active', on);
            t.setAttribute('aria-selected', on ? 'true' : 'false');
          });
          forms.forEach(f => {
            const on = f.id === targetId;
            f.classList.toggle('active', on);
            f.hidden = !on;
          });
        });
      });
    })();

    /* Form submitter — shared by both forms.
       POSTs to VV_ENDPOINT with a `form` field the backend routes on. */
    async function submitForm(form, formType, statusEl) {
      const data = { form: formType };
      new FormData(form).forEach((val, key) => { data[key] = val; });

      const btn = form.querySelector('.cf-submit');
      const origLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Sending…';
      statusEl.textContent = '';
      statusEl.className = 'cf-status';

      const endpoint = window.VV_ENDPOINT;
      if (!endpoint || /PASTE_YOUR/.test(endpoint)) {
        statusEl.textContent = 'Contact form is being set up — email velvetvibrance@gmail.com in the meantime.';
        statusEl.classList.add('error');
        btn.disabled = false; btn.textContent = origLabel;
        return;
      }

      const url = endpoint + (endpoint.indexOf('?') === -1 ? '?' : '&') +
                  'origin=' + encodeURIComponent(location.origin);
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data),
          redirect: 'follow'
        });
        const txt = await res.text();
        let parsed;
        try { parsed = JSON.parse(txt); }
        catch { throw new Error('Non-JSON response'); }

        if (parsed && parsed.ok) {
          form.reset();
          statusEl.textContent = 'Sent — thanks. I\'ll be in touch within 48 hours.';
          statusEl.classList.add('success');
        } else {
          const err = (parsed && parsed.error) || 'unknown';
          statusEl.textContent = 'Could not send (' + err + '). Try again or email velvetvibrance@gmail.com.';
          statusEl.classList.add('error');
        }
      } catch (err) {
        statusEl.textContent = 'Network error. Try again or email velvetvibrance@gmail.com.';
        statusEl.classList.add('error');
      } finally {
        btn.disabled = false;
        btn.textContent = origLabel;
      }
    }

    document.getElementById('form-book').addEventListener('submit', e => {
      e.preventDefault();
      submitForm(e.target, 'booking', document.getElementById('bk-status'));
    });
    document.getElementById('form-contact').addEventListener('submit', e => {
      e.preventDefault();
      submitForm(e.target, 'contact', document.getElementById('cn-status'));
    });
  </script>
