<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Velvet Vibrance — under maintenance. The frequency returns shortly." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none';" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>VELVET VIBRANCE — Under Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --velvet:      #8B1A1A;
      --velvet-glow: #B83838;
      --honey:       #E8B547;
      --paper:       #f5ede0;
      --paper-dim:   rgba(245,237,224,0.62);
      --paper-mute:  rgba(245,237,224,0.34);
      --line-warm:   rgba(232,181,71,0.22);
    }
    html, body {
      height: 100%;
      background: #060303;
      color: var(--paper);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Dither canvas ── */
    #bg-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: block;
      z-index: 0;
    }
    .bg-vignette {
      position: fixed; inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.55) 75%, rgba(0,0,0,0.92) 100%),
        linear-gradient(180deg, rgba(78,13,13,0.18) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
    }
    .bg-noise {
      position: fixed; inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.06;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>");
    }

    /* ── Stage ── */
    .stage {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      gap: 1.4rem;
    }
    .mark {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 0.8rem;
      letter-spacing: 0.46em;
      color: var(--honey);
      text-transform: uppercase;
      opacity: 0;
      animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
    }
    .rule {
      width: 1px; height: 56px;
      background: linear-gradient(to bottom, transparent, var(--honey), transparent);
      opacity: 0;
      animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }
    .head {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 900;
      font-size: clamp(2.2rem, 7vw, 5.4rem);
      line-height: 0.95;
      letter-spacing: -0.015em;
      color: var(--paper);
      text-shadow: 0 0 60px rgba(184,56,56,0.45);
      max-width: 18ch;
      opacity: 0;
      animation: rise 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
    }
    .head em {
      color: var(--honey);
      font-style: italic;
    }
    .sub {
      max-width: 36ch;
      font-size: 0.78rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--paper-dim);
      line-height: 1.7;
      opacity: 0;
      animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.95s forwards;
    }
    .badge {
      margin-top: 0.8rem;
      display: inline-flex; align-items: center; gap: 0.6rem;
      padding: 0.55rem 1rem;
      border: 1px solid var(--line-warm);
      border-radius: 999px;
      background: rgba(10,6,6,0.55);
      backdrop-filter: blur(8px);
      font-size: 0.62rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--paper-mute);
      opacity: 0;
      animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 1.15s forwards;
    }
    .pulse {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--velvet-glow);
      box-shadow: 0 0 8px var(--velvet-glow);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.7); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .foot {
      position: fixed;
      bottom: 1.4rem; left: 0; right: 0;
      z-index: 3;
      text-align: center;
      font-size: 0.58rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(245,237,224,0.28);
      opacity: 0;
      animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards;
    }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="bg-vignette"></div>
<div class="bg-noise"></div>

<main class="stage">
  <div class="mark">Velvet Vibrance</div>
  <div class="rule"></div>
  <h1 class="head">The Vibes Are Under <em>Maintenance</em></h1>
  <p class="sub">The frequency is being retuned. We'll be back when the room is right.</p>
  <span class="badge"><span class="pulse"></span> Signal · Recalibrating</span>
</main>

<div class="foot">est. 2024 · velvet vibrance collective</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
/* ════════════════════════════════════════════════════════════
   DITHER SHADER · velvet red w/ honey accents · infinite loop
   ════════════════════════════════════════════════════════════ */
(function () {
  const canvas = document.getElementById('bg-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(1);
  renderer.setClearColor(0x000000, 1);

  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  /* ── Wave scene ── */
  const waveScene = new THREE.Scene();
  const waveUniforms = {
    time:           { value: 0 },
    resolution:     { value: new THREE.Vector2(1, 1) },
    waveSpeed:      { value: 0.05 },
    waveFrequency:  { value: 3.0 },
    waveAmplitude:  { value: 0.32 },
    waveColor:      { value: new THREE.Vector3(0.62, 0.13, 0.16) },
    accentColor:    { value: new THREE.Vector3(0.95, 0.72, 0.28) }
  };
  const waveMat = new THREE.ShaderMaterial({
    uniforms: waveUniforms,
    vertexShader: `
      void main() { gl_Position = vec4(position, 1.0); }
    `,
    fragmentShader: `
      precision highp float;
      uniform vec2 resolution;
      uniform float time;
      uniform float waveSpeed;
      uniform float waveFrequency;
      uniform float waveAmplitude;
      uniform vec3 waveColor;
      uniform vec3 accentColor;

      vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
      vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
      vec2 fade(vec2 t) { return t*t*t*(t*(t*6.0-15.0)+10.0); }

      float cnoise(vec2 P) {
        vec4 Pi = floor(P.xyxy) + vec4(0.0,0.0,1.0,1.0);
        vec4 Pf = fract(P.xyxy) - vec4(0.0,0.0,1.0,1.0);
        Pi = mod289(Pi);
        vec4 ix = Pi.xzxz;
        vec4 iy = Pi.yyww;
        vec4 fx = Pf.xzxz;
        vec4 fy = Pf.yyww;
        vec4 i = permute(permute(ix) + iy);
        vec4 gx = fract(i * (1.0/41.0)) * 2.0 - 1.0;
        vec4 gy = abs(gx) - 0.5;
        vec4 tx = floor(gx + 0.5);
        gx = gx - tx;
        vec2 g00 = vec2(gx.x, gy.x);
        vec2 g10 = vec2(gx.y, gy.y);
        vec2 g01 = vec2(gx.z, gy.z);
        vec2 g11 = vec2(gx.w, gy.w);
        vec4 norm = taylorInvSqrt(vec4(dot(g00,g00), dot(g01,g01), dot(g10,g10), dot(g11,g11)));
        g00 *= norm.x; g01 *= norm.y; g10 *= norm.z; g11 *= norm.w;
        float n00 = dot(g00, vec2(fx.x, fy.x));
        float n10 = dot(g10, vec2(fx.y, fy.y));
        float n01 = dot(g01, vec2(fx.z, fy.z));
        float n11 = dot(g11, vec2(fx.w, fy.w));
        vec2 fade_xy = fade(Pf.xy);
        vec2 n_x = mix(vec2(n00, n01), vec2(n10, n11), fade_xy.x);
        return 2.3 * mix(n_x.x, n_x.y, fade_xy.y);
      }

      float fbm(vec2 p) {
        float value = 0.0;
        float amp = 1.0;
        float freq = waveFrequency;
        for (int i = 0; i < 4; i++) {
          value += amp * abs(cnoise(p));
          p *= freq;
          amp *= waveAmplitude;
        }
        return value;
      }

      float pattern(vec2 p) {
        vec2 p2 = p - time * waveSpeed;
        return fbm(p + fbm(p2));
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / resolution.xy;
        uv -= 0.5;
        uv.x *= resolution.x / resolution.y;

        float f = pattern(uv);

        vec3 col = mix(vec3(0.0), waveColor, f);
        float hot = smoothstep(0.55, 1.05, f);
        col = mix(col, accentColor, hot * 0.55);

        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  waveScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), waveMat));

  /* ── Bayer matrix → DataTexture (so we stay in WebGL 1.0) ── */
  const bayer = [
     0,48,12,60, 3,51,15,63,
    32,16,44,28,35,19,47,31,
     8,56, 4,52,11,59, 7,55,
    40,24,36,20,43,27,39,23,
     2,50,14,62, 1,49,13,61,
    34,18,46,30,33,17,45,29,
    10,58, 6,54, 9,57, 5,53,
    42,26,38,22,41,25,37,21
  ];
  const bayerData = new Uint8Array(64 * 4);
  for (let i = 0; i < 64; i++) {
    const v = Math.round(bayer[i] * (255 / 63));
    bayerData[i*4] = bayerData[i*4+1] = bayerData[i*4+2] = v;
    bayerData[i*4+3] = 255;
  }
  const bayerTex = new THREE.DataTexture(bayerData, 8, 8, THREE.RGBAFormat);
  bayerTex.magFilter = THREE.NearestFilter;
  bayerTex.minFilter = THREE.NearestFilter;
  bayerTex.wrapS = THREE.RepeatWrapping;
  bayerTex.wrapT = THREE.RepeatWrapping;
  bayerTex.needsUpdate = true;

  /* ── Dither scene ── */
  const ditherScene = new THREE.Scene();
  const rt = new THREE.WebGLRenderTarget(2, 2, {
    minFilter: THREE.NearestFilter,
    magFilter: THREE.NearestFilter,
    format:    THREE.RGBAFormat
  });
  const ditherUniforms = {
    tInput:     { value: rt.texture },
    tBayer:     { value: bayerTex },
    resolution: { value: new THREE.Vector2(1, 1) },
    colorNum:   { value: 4.0 },
    pixelSize:  { value: 2.0 }
  };
  const ditherMat = new THREE.ShaderMaterial({
    uniforms: ditherUniforms,
    vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
    fragmentShader: `
      precision highp float;
      uniform sampler2D tInput;
      uniform sampler2D tBayer;
      uniform vec2 resolution;
      uniform float colorNum;
      uniform float pixelSize;

      vec3 doDither(vec2 uv, vec3 color) {
        vec2 scaledCoord = floor(uv * resolution / pixelSize);
        vec2 bayerUv = (scaledCoord + 0.5) / 8.0;
        float t = texture2D(tBayer, fract(bayerUv)).r;
        float threshold = t - 0.25;
        float stp = 1.0 / (colorNum - 1.0);
        color += threshold * stp;
        float bias = 0.18;
        color = clamp(color - bias, 0.0, 1.0);
        return floor(color * (colorNum - 1.0) + 0.5) / (colorNum - 1.0);
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / resolution.xy;
        vec2 normalizedPixelSize = pixelSize / resolution;
        vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
        vec4 col = texture2D(tInput, uvPixel);
        col.rgb = doDither(uv, col.rgb);
        gl_FragColor = col;
      }
    `
  });
  ditherScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), ditherMat));

  /* ── Resize ── */
  function resize() {
    const w = Math.floor(canvas.clientWidth);
    const h = Math.floor(canvas.clientHeight);
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    rt.setSize(w, h);
    waveUniforms.resolution.value.set(w, h);
    ditherUniforms.resolution.value.set(w, h);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ── Infinite loop ── */
  const start = performance.now();
  (function tick() {
    const t = (performance.now() - start) / 1000;
    waveUniforms.time.value = t;
    renderer.setRenderTarget(rt);
    renderer.render(waveScene, camera);
    renderer.setRenderTarget(null);
    renderer.render(ditherScene, camera);
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
